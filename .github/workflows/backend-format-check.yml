name: Backend Format Check

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - brautcloud-backend/**
      - .github/workflows/backend-format-check.yml
  push:
    branches:
      - dev
      - main
    paths:
      - brautcloud-backend/**
      - .github/workflows/backend-format-check.yml

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brautcloud-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
          cache-dependency-path: brautcloud-backend/pom.xml

      - name: Run and check formatting
        run: ./mvnw -B spring-javaformat:validate
