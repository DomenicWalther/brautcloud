name: Supply chain checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend dependency checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brautcloud-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up GraalVM JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven
          cache-dependency-path: brautcloud-backend/pom.xml

      - name: Verify Maven wrapper
        run: ./mvnw -B --version

      - name: Verify dependency checksums
        run: >-
          ./mvnw -B -ntp -Daether.checksums.fail=true
          org.apache.maven.plugins:maven-dependency-plugin:3.9.0:go-offline
          -DskipTests

      - name: Scan backend dependencies for vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@9fd1bcce27f67e3bd819a0a7620e332803dc43bc # v2.3.8
        with:
          scan-args: |-
            -r
            brautcloud-backend

      - name: Generate backend SBOM
        run: >-
          ./mvnw -B -ntp
          org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom
          -DskipTests
          -DoutputFormat=json
          -DoutputName=backend-sbom

      - name: Upload dependency reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-supply-chain-reports
          path: brautcloud-backend/target/backend-sbom.json
          if-no-files-found: ignore
