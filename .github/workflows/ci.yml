name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan tracked files for credentials
        run: python3 scripts/check-secrets.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brautcloud-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: brautcloud-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting
        run: pnpm run format:check

      - name: Run type checks
        run: pnpm run typecheck

      - name: Audit production dependencies
        run: pnpm run security:audit

      - name: Run unit tests
        run: pnpm run test:ci

      - name: Test production configuration checks
        run: pnpm run test:production-config

      - name: Build production bundle
        env:
          BRAUTCLOUD_API_URL: https://api.example.invalid/api
          BRAUTCLOUD_APP_URL: https://app.example.invalid
        run: pnpm run build

      - name: Assert production bundle URLs
        run: pnpm run assert:production-config

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brautcloud-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up GraalVM JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven
          cache-dependency-path: brautcloud-backend/pom.xml

      # spring-javaformat is bound to Maven's validate phase in pom.xml.
      # verify runs formatting validation, compilation, packaging, and tests once.
      - name: Validate, package, and test
        run: ./mvnw -B clean verify

      - name: Upload Maven test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-reports
          path: brautcloud-backend/target/surefire-reports
          if-no-files-found: ignore
