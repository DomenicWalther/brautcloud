name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brautcloud-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: brautcloud-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate formatting
        run: pnpm run format:check

      - name: Run unit tests
        run: pnpm run test:ci

      - name: Build production bundle
        run: pnpm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brautcloud-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
          cache-dependency-path: brautcloud-backend/pom.xml

      # spring-javaformat is bound to Maven's validate phase in pom.xml.
      # verify runs formatting validation, compilation, packaging, and tests once.
      - name: Validate, package, and test
        run: ./mvnw -B clean verify

      - name: Upload Maven test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: brautcloud-backend/target/surefire-reports
          if-no-files-found: ignore
