<app-auth-shell
  eyebrow="Account access"
  title="Reset your password"
  description="Password recovery is not available yet. Your gallery and photographs remain private and unchanged."
>
  <section class="bc-empty-state auth-empty-state" aria-labelledby="reset-status-title">
    <div class="bc-empty-state__inner">
      <span class="material-symbols-outlined" aria-hidden="true">lock_reset</span>
      <h2 id="reset-status-title">Recovery is coming soon</h2>
      <p>
        Please return to sign in, or contact the person managing your BrautCloud gallery if you need
        access now.
      </p>
      <a class="bc-button bc-button--secondary" routerLink="/auth/sign-in">Back to sign in</a>
    </div>
  </section>
</app-auth-shell>
