<label class="bc-field bc-field--inverse">
  <span class="bc-field-label">{{ label() }}</span>
  <input
    class="bc-input"
    [type]="type()"
    [placeholder]="placeholder()"
    [formField]="field()"
    [attr.aria-invalid]="fieldState().touched() && fieldState().invalid()"
  />
  @if (fieldState().touched() && fieldState().invalid()) {
    <div role="alert">
      @for (error of fieldState().errors(); track error) {
        <p class="bc-field-error">{{ error.message }}</p>
      }
    </div>
  }
</label>
