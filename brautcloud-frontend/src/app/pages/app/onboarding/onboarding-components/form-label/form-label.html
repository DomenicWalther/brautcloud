<div>
  <label class="flex flex-col gap-2 flex-1">
    <span class="font-sc text-sm text-white/80">{{ label() }}</span>
    <input
      type="text"
      [placeholder]="placeholder()"
      [formField]="field()"
      class="w-full bg-white/4 border-white/10 border text-sm px-4 py-5 focus:border-gold transition-all duration-300 appearance-none outline-none"
    />
  </label>
  @if (fieldState().touched() && fieldState().invalid()) {
    @for (error of fieldState().errors(); track error) {
      <p class="mt-2 text-red-600/40 text-sm">{{ error.message }}</p>
    }
  }
</div>
