spring.application.name=brautcloud

# === DATABASE ===

spring.datasource.password=${POSTGRES_PW}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.url=${POSTGRES_URL}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=none


# ==== AWS ====

aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}
aws.s3.endpoint=${AWS_ENDPOINT}
aws.s3.region=us-east-1
aws.s3.bucket=brautcloud


# ==== SECURITY ====
logging.level.org.springframework.security=TRACE
logging.level.org.flywaydb=DEBUG

jwt.token.secret=${JWT_SECRET}
jwt.token.expires=600000
jwt.token.refreshExpires=30d

# Refresh token cookie. Defaults to production-safe values; override app.cookie.secure=false
# only for local HTTP development via an environment-specific properties file.
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Strict}



