spring.application.name=brautcloud

# === DATABASE ===

spring.datasource.password=${POSTGRES_PW}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.url=${POSTGRES_URL}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=none


# ==== AWS ====

aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}
aws.s3.endpoint=${AWS_ENDPOINT}
aws.s3.region=us-east-1
aws.s3.bucket=brautcloud


# ==== SECURITY ====
logging.level.org.springframework.security=TRACE
logging.level.org.flywaydb=DEBUG

jwt.token.secret=${JWT_SECRET}
jwt.token.expires=600000
jwt.token.refreshExpires=30d

# Cookie policy is explicit and independent of servlet request security (which can be wrong behind TLS proxies).
# Set APP_COOKIE_SECURE=false only for local HTTP development. Production must keep it true.
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Strict}
app.guest-cookie.same-site=${APP_GUEST_COOKIE_SAME_SITE:Lax}

# In-process abuse controls. Keep limits conservative per instance; upstream proxies can add
# a distributed layer without changing application behavior.
app.auth.rate-limit.window=${APP_AUTH_RATE_LIMIT_WINDOW:15m}
app.auth.login.max-attempts=${APP_AUTH_LOGIN_MAX_ATTEMPTS:20}
app.auth.registration.max-attempts=${APP_AUTH_REGISTRATION_MAX_ATTEMPTS:20}
app.auth.rate-limit.max-tracked-keys=${APP_AUTH_RATE_LIMIT_MAX_TRACKED_KEYS:10000}
app.auth.login.initial-backoff=${APP_AUTH_LOGIN_INITIAL_BACKOFF:500ms}
app.auth.login.max-backoff=${APP_AUTH_LOGIN_MAX_BACKOFF:15m}
app.gallery.rate-limit.window=${APP_GALLERY_RATE_LIMIT_WINDOW:10m}
app.gallery.rate-limit.max-failures=${APP_GALLERY_RATE_LIMIT_MAX_FAILURES:5}
app.gallery.rate-limit.max-tracked-keys=${APP_GALLERY_RATE_LIMIT_MAX_TRACKED_KEYS:10000}
app.gallery.rate-limit.initial-backoff=${APP_GALLERY_RATE_LIMIT_INITIAL_BACKOFF:500ms}
app.gallery.rate-limit.max-backoff=${APP_GALLERY_RATE_LIMIT_MAX_BACKOFF:15m}

# Browser mutation allow-list. Include public frontend origin(s), comma-separated.
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:4200}

# Honor Forwarded/X-Forwarded-* for framework URL handling behind TLS-terminating proxies.
server.forward-headers-strategy=framework



