# Integration tests receive their JDBC connection from PostgreSQL Testcontainers.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.task.scheduling.enabled=false
spring.jpa.open-in-view=true

# Safe placeholders only. Tests replace S3Service and never contact this endpoint.
aws.accessKeyId=${TEST_AWS_ACCESS_KEY_ID:test-access-key-placeholder}
aws.secretAccessKey=${TEST_AWS_SECRET_ACCESS_KEY:test-secret-key-placeholder}
aws.s3.endpoint=http://127.0.0.1:1
aws.s3.region=us-east-1
aws.s3.bucket=brautcloud-test

jwt.token.secret=${TEST_JWT_SECRET:test-only-signing-secret-placeholder-that-is-at-least-thirty-two-bytes}
jwt.token.expires=600000
jwt.token.refreshExpires=30d

logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN
