# Integration tests receive their JDBC connection from PostgreSQL Testcontainers.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.task.scheduling.enabled=false
spring.jpa.open-in-view=true

# Safe local-only values: tests replace S3Service and never contact this endpoint.
aws.accessKeyId=test-access-key
aws.secretAccessKey=test-secret-key
aws.s3.endpoint=http://127.0.0.1:1
aws.s3.region=us-east-1
aws.s3.bucket=brautcloud-test

jwt.token.secret=test-only-signing-secret-that-is-at-least-thirty-two-bytes-long
jwt.token.expires=600000
jwt.token.refreshExpires=30d

logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN
