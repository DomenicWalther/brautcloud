services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-brautcloud}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a local-only value}'
      - 'POSTGRES_USER=${POSTGRES_USER:-brautcloud}'
    ports:
      - '5432:5432'
  aistor:
    image: quay.io/minio/aistor/minio:latest
    command: minio server /mnt/data --license /minio.license
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - /${HOME}/minio/certs:/etc/minio/certs
      - /${HOME}/minio/data:/mnt/data
      - /${HOME}/minio/minio.license:/minio.license
    tty: true
